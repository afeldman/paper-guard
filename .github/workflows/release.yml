# Automatic release trigger for Paper Guard.
#
# Pushing a signed, annotated version tag (e.g. `git tag -s v1.0.0 && git push
# origin v1.0.0`) starts the authoritative release build. All the actual
# validation, platform builds, checksums, and GitHub Release publishing live in
# the reusable `release-core.yml` workflow, invoked here with the exact tag ref.
#
# The workflow builds from the tagged commit (refs/tags/v*) exactly — never
# from `main`. The release artifacts therefore correspond to the immutable tag.
#
# Developer experience:
#   git tag -s v1.0.0 -m "Paper Guard v1.0.0"
#   git push origin v1.0.0
#   # -> GitHub Actions builds + validates + publishes the release
name: Release

on:
  push:
    tags: ["v*"]

# Least-privilege. This caller's entire purpose is publishing a release, which
# requires a contents:write token for the GitHub Release creation. The build,
# validation, and security jobs inside the reusable workflow are individually
# pinned to contents:read, so only the single publish step runs with write
# access. Nothing here pollutes secrets or non-release repository contents.
permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    uses: ./.github/workflows/release-core.yml
    with:
      tag_name: ${{ github.ref_name }}
      ref: ${{ github.ref }}
    permissions:
      contents: write
