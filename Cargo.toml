[workspace]
resolver = "2"
members = [
    "crates/paper-guard-core",
    "crates/paper-guard-llm",
    "crates/paper-guard-parser",
    "crates/paper-guard-renderer",
    "crates/paper-guard-review",
    "crates/paper-guard-bibliography",
    "crates/paper-guard-agents",
    "crates/paper-guard-ledger",
    "crates/paper-guard-validation",
    "crates/paper-guard-app",
    "crates/paper-guard-report",
    "crates/paper-guard-service",
    "crates/paper-guard-client",
    "crates/paper-guard-discovery",
    "crates/paper-guard-cli",
    "crates/paper-guard-gui",
]

[workspace.package]
version = "1.1.6"
edition = "2021"
license = "Apache-2.0"
authors = ["Anton Feldmann <anton.feldmann@udo.edu>"]
repository = "https://github.com/afeldman/paper-guard"
description = "A reproducible, multi-agent scientific review and revision workflow for papers."

[workspace.dependencies]
# --- Standard ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
rust-loguru = "0.1"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "rustls", "rustls-native-certs"] }
wiremock = "0.6"
axum = "0.8"
tower = "0.5"
base64 = "0.23"
dirs = "6"

# --- Internal crates ---
paper-guard-core = { path = "crates/paper-guard-core" }
paper-guard-llm = { path = "crates/paper-guard-llm" }
paper-guard-parser = { path = "crates/paper-guard-parser" }
paper-guard-renderer = { path = "crates/paper-guard-renderer" }
paper-guard-review = { path = "crates/paper-guard-review" }
paper-guard-bibliography = { path = "crates/paper-guard-bibliography" }
paper-guard-agents = { path = "crates/paper-guard-agents" }
paper-guard-ledger = { path = "crates/paper-guard-ledger" }
paper-guard-validation = { path = "crates/paper-guard-validation" }
paper-guard-app = { path = "crates/paper-guard-app" }
paper-guard-report = { path = "crates/paper-guard-report" }
paper-guard-service = { path = "crates/paper-guard-service" }
paper-guard-client = { path = "crates/paper-guard-client" }
paper-guard-discovery = { path = "crates/paper-guard-discovery" }
paper-guard-gui = { path = "crates/paper-guard-gui" }

