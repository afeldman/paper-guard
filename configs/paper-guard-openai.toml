# Paper Guard configuration for the real OpenAI-compatible provider.
#
# Use with:  paper-guard run manuscript.tex --config configs/paper-guard-openai.toml
#
# The API key is NOT stored in this file. Provide it via the environment
# variable named by `api_key_env` (default OPENAI_API_KEY):
#   export OPENAI_API_KEY=sk-...
#
# The same [providers.openai-compatible] section can point at ANY
# OpenAI-compatible endpoint (OpenAI, Mammoth.ai, a local server, etc.):
#   * OpenAI        => base_url = "https://api.openai.com/v1"
#   * Mammoth.ai    => base_url = "<Mammoth.ai OpenAI-compatible endpoint>"
#   * local server  => base_url = "http://localhost:8080/v1"

[project]
name = "my-paper"

[input]
# format = "latex"

[llm]
provider = "openai-compatible"

[providers.openai-compatible]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o-mini"
timeout_seconds = 120
max_retries = 2
# Controls how the endpoint constrains its output at the *transport* layer.
# Structured output only shapes the JSON the endpoint returns; it does NOT make
# an LLM scientifically trustworthy. Scientific validity is enforced separately
# by Paper Guard's domain validation, evidence checks, provenance, Judge, and
# integrity guards. JSON Schema enforcement != scientific correctness.
#
#   structured_output = false          # free-form; reviewer-side validation still enforces JSON
#   structured_output = true           # {"type":"json_object"} (historical default)
#   structured_output = "json_object"  # same as `true`
#   structured_output = "json_schema"  # full JSON Schema (LM Studio/Ollama servers)
#
# When "json_schema" is set, Paper Guard derives a strict JSON Schema from the
# reviewer finding type (numeric confidence, required fields) and sends it in
# the request `response_format`. If the endpoint cannot honour the requested
# mode, Paper Guard fails explicitly rather than silently downgrading. Use
# `true` (json_object) for OpenAI / Mammoth.ai; use "json_schema" for local
# servers such as LM Studio / Ollama. If a server rejects json_object (e.g.
# LM Studio requires json_schema), switch to "json_schema".
structured_output = true
# Set to true only if the configured model actually supports vision.
vision = false

[reviewers.scientific]
enabled = true
provider = "openai-compatible"
model = "gpt-4o-mini"

[reviewers.adversarial]
enabled = true
provider = "openai-compatible"
model = "gpt-4o-mini"

[reviewers.evidence]
enabled = true
provider = "openai-compatible"
model = "gpt-4o-mini"

[reviewers.references]
enabled = true
provider = "openai-compatible"
model = "gpt-4o-mini"

[reviewers.figures]
enabled = true
provider = "openai-compatible"
model = "gpt-4o-mini"

[review]
# Presentation style for the human-readable report. Purely presentational:
# neutral / funny / insulting never alter the canonical findings.
# Priority: CLI `--style` > this config value > `neutral` default.
style = "neutral"

[judge]
model = "gpt-4o-mini"
require_human_approval_for_major = true

[revision]
require_human_approval_for_major = true
output_dir = ".paper-guard"

[reproducibility]
seed = 42
prompt_version = "v1"
data_dir = ".paper-guard"

# --- Service mode (optional) ------------------------------------------------
[service]
bind = "127.0.0.1:8080"
allow_external_bind = false
data_dir = ".paper-guard"

# --- Review Memory (retrieval-based; PRIVATE by default) ---------------------
[memory]
backend = "none"
qdrant_url = "http://localhost:6333"
collection = "review_memory"
require_approval = true
# M4: Review Memory is disabled by default. When enabled, mode is one of
# off / read_only / write / read_write. Embeddings use the mock provider by
# default (offline); set embedding_provider = "openai-compatible" + an
# embedding_model to use an /embeddings endpoint (e.g. Ollama).
enabled = false
mode = "off"
top_k = 5
min_similarity = 0.75
embedding_provider = "mock"
embedding_model = "mock"
owner_id = ""
team_id = ""

# --- Remote service mode (optional) ----------------------------------------
# Empty `url` => local/standalone mode. Set it to a deployed service to run
# reviews remotely. The auth token lives in the named env var at runtime.
[server]
url = ""
auth_token_env = "PAPER_GUARD_TOKEN"
timeout_seconds = 120
