# Paper Guard configuration (versioned).
# This is the deterministic default used for reproducibility and offline runs.

[project]
name = "my-paper"

[input]
# format = "latex"   # optional override; otherwise inferred from the file extension

# --- LLM provider selection ------------------------------------------------
# `provider = "mock"` (default) keeps every run offline and deterministic.
# Set `provider = "openai-compatible"` to use the real provider; the endpoint
# details are under [providers.openai-compatible].
[llm]
provider = "mock"

# --- OpenAI-compatible backend ---------------------------------------------
# The single production backend connecting to ANY OpenAI-compatible endpoint
# (OpenAI, Mammoth.ai, a local server, ...). Switching backends is a
# configuration change only, never a code change.
# The API key is NEVER stored here — only the name of the environment variable
# that holds it. Request logging never includes the key.
[providers.openai-compatible]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o-mini"
timeout_seconds = 120
max_retries = 2
structured_output = true
vision = false

# --- Reviewer LLM assignments -------------------------------------------
# Each reviewer runs independently and is assigned a provider + model.
# With `provider = "mock"`, Paper Guard uses deterministic fixtures so the
# whole pipeline runs offline with no external LLM API.
[reviewers.scientific]
enabled = true
provider = "mock"
model = "mock"

[reviewers.adversarial]
enabled = true
provider = "mock"
model = "mock"

[reviewers.evidence]
enabled = true
provider = "mock"
model = "mock"

[reviewers.references]
enabled = true
provider = "mock"
model = "mock"

[reviewers.figures]
enabled = true
provider = "mock"
model = "mock"

[judge]
model = "mock"
require_human_approval_for_major = true

[revision]
# Major changes require explicit human approval before they are applied.
require_human_approval_for_major = true
output_dir = ".paper-guard"

[reproducibility]
seed = 42
prompt_version = "v1"
data_dir = ".paper-guard"

# --- Service mode ----------------------------------------------------------
# Optional HTTP service. Runs the SAME application layer as the CLI. By default
# it binds to loopback only; set allow_external_bind = true (plus your own
# auth/firewall) before exposing it to a network. No destructive endpoints.
[service]
bind = "127.0.0.1:8080"
allow_external_bind = false
data_dir = ".paper-guard"

# --- Review Memory ---------------------------------------------------------
# Retrieval-based learning, NOT training. Default `backend = "none"` (off).
# Every unit starts PRIVATE and only becomes retrievable/exportable through
# explicit human consent — a paper is never used for anything beyond its own
# review automatically. `file` is an offline JSON store; `qdrant` is the
# optional vector backend (service mode). Qdrant must be configured and is
# never required for standalone.
[memory]
backend = "none"
qdrant_url = "http://localhost:6333"
collection = "review_memory"
require_approval = true
# M4: Review Memory is disabled by default. When enabled, mode is one of
# off / read_only / write / read_write. Embeddings use the mock provider by
# default (offline); set embedding_provider = "openai-compatible" + an
# embedding_model to use an /embeddings endpoint (e.g. Ollama).
enabled = false
mode = "off"
top_k = 5
min_similarity = 0.75
embedding_provider = "mock"
embedding_model = "mock"
owner_id = ""
team_id = ""

# --- Remote service mode (M3.5) -------------------------------------------
# Optional connection to a centrally-deployed Paper Guard service. When
# `url` is set, `paper-guard review/run` executes the manuscript on that
# service instead of locally (the service is authoritative for the remote
# run). Leave `url` empty for standalone/local mode. The auth token is read
# from the named environment variable at runtime and is NEVER stored here.
[server]
url = ""
auth_token_env = "PAPER_GUARD_TOKEN"
timeout_seconds = 120
