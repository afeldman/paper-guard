apiVersion: v2
name: paper-guard
description: |
  Paper Guard — scientific quality-assurance and pre-submission review for
  already-written papers. This chart deploys the Paper Guard HTTP service. It
  does NOT bundle Qdrant or Ollama; those are configured as external endpoints.
