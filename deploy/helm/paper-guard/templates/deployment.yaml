apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paper-guard.fullname" . }}
  labels:
    {{- include "paper-guard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "paper-guard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paper-guard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: paper-guard
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # The API key is injected ONLY from the Kubernetes Secret when a
          # secret name is configured; it is never embedded in values.yaml or
          # the ConfigMap.
          env:
            - name: PAPER_GUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "paper-guard.secretName" . }}
                  key: {{ .Values.llm.apiKeySecretKey | default "api-key" }}
                  optional: true
            - name: RUST_LOG
              value: "{{ .Values.logging.level }}"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "paper-guard.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paper-guard.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
