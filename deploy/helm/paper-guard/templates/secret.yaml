# The API key lives in a Kubernetes Secret, never in values.yaml or the
# ConfigMap. The recommended flow is to create the Secret out-of-band so a key
# is never embedded in chart values:
#
#   kubectl create secret generic paper-guard-api-key \
#     --from-literal=api-key='sk-...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This template only creates an EMPTY placeholder Secret (never a real key)
# when `llm.apiKeySecretName` is set, so the referenced secret exists for the
# deployment's `optional: true` secretKeyRef. Populate it out-of-band (or with
# an external secret manager / sealed-secrets). If `apiKeySecretName` is empty,
# requests are sent without an Authorization header (keyless local Ollama).
{{- if .Values.llm.apiKeySecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.apiKeySecretName }}
  labels:
    {{- include "paper-guard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Deliberately empty: never commit a real key here. Populate via
  # `kubectl create secret generic <name> --from-literal=api-key=...`.
  {{ .Values.llm.apiKeySecretKey | default "api-key" }}: ""
{{- end }}
