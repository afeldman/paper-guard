# -- number of Paper Guard service replicas
replicas: 1

image:
  # -- container image
  repository: paper-guard/paper-guard
  # -- image tag (tag = chart appVersion if omitted)
  tag: ""
  # -- image pull policy
  pullPolicy: IfNotPresent

service:
  # -- kubernetes Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- service port exposed to the cluster
  port: 80
  # -- container (target) port the service listens on
  targetPort: 8080

# -- resource requests/limits for the Paper Guard container
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# -- environment to inject into the Paper Guard container (in addition to the
# LLM/Qdrant config below). Add tuning/logging env vars here.
extraEnv: []
# - name: RUST_LOG
#   value: info

logging:
  # -- enable JSON structured logging; secrets are never logged
  format: json
  level: info

llm:
  # -- LLM provider kind: "mock" (offline/deterministic) or "openai-compatible"
  provider: openai-compatible
  # -- endpoint base URL (OpenAI, Mammoth.ai, or a local Ollama /v1 endpoint)
  endpoint: https://api.openai.com/v1
  # -- model name (configuration-driven, never hard-coded in code)
  model: gpt-4o-mini
  # -- structured JSON output support
  structuredOutput: true
  # -- multimodal vision support
  vision: false
  # -- name of a Kubernetes Secret key holding the API key. If empty, requests
  # are sent without an Authorization header (e.g. keyless local Ollama).
  apiKeySecretName: ""
  apiKeySecretKey: "api-key"

qdrant:
  # -- Qdrant endpoint (external/configured; not bundled)
  endpoint: http://qdrant:6333
  # -- Qdrant collection for review memory
  collection: review_memory

memory:
  # -- Whether Review Memory is enabled. Default false: existing runs are
  # unchanged. Set true to enable retrieval-based learning.
  enabled: false
  # -- Memory access mode: off | read_only | write | read_write.
  mode: off
  # -- Max retrieved memory entries per review.
  topK: 5
  # -- Minimum cosine similarity threshold (0..1) for retrieval.
  minSimilarity: 0.75
  # -- Embedding provider: mock (offline) or openai-compatible (incl. Ollama
  # /v1 embeddings endpoint). Never hard-coded.
  embeddingProvider: mock
  # -- Embedding model name (used by openai-compatible). Configurable.
  embeddingModel: mock
  # -- Optional owner identity attributed to locally-recorded memory.
  ownerId: ""
  # -- Optional team id for sharing approved memory across a team.
  teamId: ""

# -- LAN (mDNS/DNS-SD) service discovery. This configures the Paper Guard
# service's own [discovery] section (used by `paper-guard discover`) and, when
# `publisher.enabled` is true, deploys a *separate* mDNS publisher pod that
# advertises `paper-guard.local` so clients on the LAN can find the service.
# mDNS is NOT run inside the Paper Guard app container.
discovery:
  # -- Whether the Paper Guard service should accept/emit discovery config.
  # False by default so nothing probes the network implicitly.
  enabled: false
  # -- Discovery mode: off | manual | auto.
  mode: off
  # -- DNS-SD service type to advertise/browse (usually leave default).
  serviceType: "_paper-guard._tcp.local."
  # -- Hostname to advertise for the service (used by the optional publisher).
  hostname: "paper-guard.local"
  # -- Optional exact hostname that Auto mode may prefer when multiple
  # services are present. Never "first response wins".
  preferredService: ""
  # -- Optional separate mDNS publisher pod (default false). This is an
  # infrastructure component with its own securityContext; it is never merged
  # into the Paper Guard container. Set true only if you run multicast on the
  # host network and want clients to discover the service by hostname.
  publisher:
    # -- Deploy the separate mDNS publisher pod.
    enabled: false
    # -- Image used for the publisher. Override with an image that provides an
    # mDNS/avahi bridge suitable for your node network. The referenced image
    # must advertise `paper-guard.local` -> the Kubernetes Service address.
    repository: "paper-guard/mdns-bridge"
    tag: ""
    # -- Publisher pod security context (must be run with multicast/HostNetwork
    # capabilities; scoped to this pod only, never the app).
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "NET_RAW"]
      privileged: false
    # -- Whether the publisher needs hostNetwork (true when the CNI blocks
    # multicast). Scope: publisher only, never the Paper Guard app.
    hostNetwork: false
    # -- Extra environment variables for the publisher pod.
    extraEnv: []

persistence:
  # -- enable a persistent volume for ledger/manuscript/memory artifacts
  enabled: true
  # -- storage class for the PVC ("" uses the cluster default)
  storageClass: ""
  # -- requested persistent storage size
  size: 1Gi

# -- optional pod security context
podSecurityContext: {}
  # fsGroup: 1000

# -- optional container security context
securityContext: {}
  # runAsNonRoot: true
